name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Keep the competition release gate stable through the announced
    # ubuntu-latest migration to 26.04 during the submission window.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run check
      - run: npm test
      - run: npm run format:check
      - name: Run browser smoke suite
        run: npm run witness -- --suite booking-v1 --build candidate --port 4321 --change "CI smoke test of the repaired appointment candidate."
      - name: Run Fieldnotes browser smoke suite
        run: npm run witness -- --suite notes-v1 --build fixed --port 4323 --change "CI smoke test of the repaired Fieldnotes candidate."
