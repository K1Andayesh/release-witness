name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run check
      - run: npm test
      - run: npm run format:check
      - name: Run browser smoke suite
        run: npm run witness -- --suite booking-v1 --build candidate --port 4321 --change "CI smoke test of the repaired appointment candidate."
